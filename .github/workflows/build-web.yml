name: Build Web (pygbag)

on:
  workflow_dispatch:          # manual trigger
  push:
    branches: [main, master]
    paths:
      - 'web_main.py'
      - 'web/**'
      - 'aquarium.py'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/build-web.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages:    write
  id-token: write

# Only one deployment at a time; cancel in-progress runs on the same branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build with pygbag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git describe --tags resolves correctly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-web.txt Pillow

      - name: Convert audio to OGG for web (MP3 unsupported; WAV music tracks too large)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg pngquant
          # Convert MP3 → OGG at 96 kbps (good quality; 64k caused audible jitter)
          for f in assets/audio/*.mp3; do
            [ -f "$f" ] || continue
            ffmpeg -i "$f" -b:a 96k "${f%.mp3}.ogg" -y -loglevel error
            rm "$f"
          done
          # Convert WAV → OGG at 96 kbps (music tracks; 96k sounds clean in browser)
          for f in assets/audio/*.wav; do
            [ -f "$f" ] || continue
            ffmpeg -i "$f" -b:a 96k "${f%.wav}.ogg" -y -loglevel error
            rm "$f"
          done
          # Patch extension references in Python source to .ogg
          find src -name "*.py" -exec sed -i 's/\.mp3"/\.ogg"/g' {} +
          find . -maxdepth 1 -name "*.py" -exec sed -i 's/\.mp3"/\.ogg"/g' {} +
          find src -name "*.py" -exec sed -i 's/\.wav"/\.ogg"/g' {} +
          find . -maxdepth 1 -name "*.py" -exec sed -i 's/\.wav"/\.ogg"/g' {} +

      - name: Optimize PNG sprites for web (palette quantization, ~40-60% size reduction)
        run: |
          # pngquant reduces PNG size by 40-60% with minimal visual quality loss.
          # --quality 70-90: good balance between file size and sprite fidelity.
          # --skip-if-larger: never make a file larger (safe for already-optimized PNGs).
          # --force --ext .png: overwrite original so pygbag picks up the smaller files.
          find assets -name "*.png" -exec \
            pngquant --quality 70-90 --skip-if-larger --force --ext .png {} \;
          echo "PNG size after optimization:"
          du -sh assets/sprites/ 2>/dev/null || du -sh assets/ 2>/dev/null | head -5

      - name: Build
        # pygbag's template (custom_site) looks for assets/main.py in the
        # archive.  It uses whatever filename is passed on the CLI, so passing
        # web_main.py produces assets/web_main.py and shell.source() can't find
        # the entry point.  Copy to main.py for the build, then remove it.
        run: |
          cp web_main.py main.py
          python -m pygbag --build --app_name "Aquarium 98" main.py
          rm -f main.py

      - name: Fix BrowserFS (bundle locally; pygbag CDN is missing this file)
        run: |
          # pygbag 0.9.3's generated index.html contains a <script> tag pointing to
          # https://pygame-web.github.io/cdn/0.9.3//browserfs.min.js (note double
          # slash AND the file is absent from that CDN), which triggers
          # ERR_BLOCKED_BY_ORB in Chrome and hangs the loading screen forever.
          # Fix: download BrowserFS 1.4.3 from jsDelivr and serve it locally.
          # Running BEFORE pwa_inject.py so the SW pre-caches browserfs.min.js too.
          curl -sSfL \
            "https://cdn.jsdelivr.net/npm/browserfs@1.4.3/dist/browserfs.min.js" \
            -o build/web/browserfs.min.js
          # Replace the broken CDN URL with the local copy.
          sed -i \
            's|src="https://pygame-web.github.io/cdn/[^"]*browserfs\.min\.js"|src="./browserfs.min.js"|g' \
            build/web/index.html
          echo "BrowserFS fix applied:"
          grep -n "browserfs" build/web/index.html

      - name: Patch HTML
        run: |
          # IMPORTANT: Do NOT add html/body overflow:hidden or height:100% rules.
          # When html/body have overflow:hidden, Chrome propagates that to the
          # viewport, which can clip the position:fixed infobox.
          #
          # The canvas already fills the viewport via its own CSS:
          #   position:absolute; top:0; bottom:0; left:0; right:0

          # Fix invalid CSS value (padding: none → padding: 0) — harmless.
          sed -i 's/padding: none;/padding: 0;/' build/web/index.html
          # Replace the loading-screen background colour — cosmetic only.
          sed -i 's/background-color:powderblue;/background-color: #000080;/' build/web/index.html

          # Set autorun:1 so Python starts immediately without a user click.
          # pygbag's default autorun:0 + ume_block:1 hides its "click to start"
          # prompt in a terminal strip below the canvas that users never see,
          # leaving the game on a grey screen indefinitely.  With autorun:1
          # Python launches on page load; audio resumes on the first canvas
          # interaction (Chrome autoplay policy), which is standard game UX.
          # Use -E to match both quoted ("autorun":0) and plain JS (autorun : 0) forms.
          sed -i -E 's/"?autorun"?\s*:\s*0/autorun : 1/g' build/web/index.html

          echo "HTML patch applied:"
          grep -n "autorun\|padding\|background-color" build/web/index.html | head -15

      - name: Inject PWA (manifest + service worker + icons)
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          python web/pwa_inject.py --version "$VERSION"

      - name: Verify pwa_inject patches applied
        run: |
          echo "=== Checking pwa_inject.py patches ==="
          grep -q "pwa_inject: done" build/web/index.html \
            && echo "OK: <!-- pwa_inject: done --> marker present" \
            || (echo "FAIL: pwa_inject patches were not applied!"; exit 1)
          grep -q "aio.cross" build/web/index.html \
            && echo "OK: CDN bypass patch present" \
            || echo "WARN: CDN bypass patch not found"
          grep -q "autorun.*1\|autorun : 1" build/web/index.html \
            && echo "OK: autorun:1 patch present" \
            || echo "WARN: autorun:1 patch not found"
          grep -q "async extraction\|files extracted\|tar.next" build/web/index.html \
            && echo "OK: async extraction patch present" \
            || echo "WARN: async extraction patch not found"
          echo "Archive size: $(du -sh build/web/aquarium98.tar.gz 2>/dev/null || echo 'not found')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
